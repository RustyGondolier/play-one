# ============================================================
# Play One — Render Blueprint
#
# Uso: en Render → New → Blueprint → apunta a este repositorio.
# Este archivo define el servicio web; la base de datos NO va
# aquí: se usa Neon (el Postgres de Render Free expira a los
# 30 días) y su connection string se configura como secreto.
#
# Plan Free: 750 h/mes, el servicio duerme a los 15 min sin
# tráfico (cold start de ~1 min). Para una demo, abrir el link
# unos minutos antes. Ver docs/DEMO.md.
# ============================================================

services:
  # ---- API + frontend (Express sirve client/dist) ----
  - type: web
    name: play-one
    runtime: node
    plan: free

    # Misma región que Neon (us-east-2): la latencia de cada
    # consulta a la base baja bastante.
    region: ohio

    # Raíz del repo: hay que construir client/ y correr server/
    buildCommand: >
      npm ci --prefix server &&
      npm ci --prefix client &&
      npm run build --prefix client
    startCommand: npm start --prefix server

    # Render asigna el puerto (PORT) y enruta ahí; Express lo lee
    # con process.env.PORT. No hay package.json en la raíz, así
    # que la versión de Node se fija aquí.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.x

      # Base de datos: se pega el connection string de Neon en el
      # dashboard de Render (Environment → Secret Files o env var).
      # Usar el "Pooled connection" de Neon.
      - key: DATABASE_URL
        sync: false

      # Secreto de los JWT. Generar uno nuevo con:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      # Sin él la API responde 401 en todas las rutas de negocio.
      - key: JWT_SECRET
        sync: false

      - key: NODE_ENV
        value: production
